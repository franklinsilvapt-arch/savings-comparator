name: Atualizar dados do ouro (PLN)

on:
  schedule:
    - cron: '30 11 * * 1-5'
  push:
    paths:
      - ".github/workflows/atualizar-zloto.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Buscar cotacao, cambio e precos NBP e escrever zloto-dane.json
        shell: python
        run: |
          import json, urllib.request, datetime, sys

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "savings-comparator-action", "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          # Historico NBP: o NBP aceita no maximo 255 cotacoes por pedido
          serie = []
          try:
              nbp = get("https://api.nbp.pl/api/cenyzlota/last/255/?format=json")
              serie = [{"d": q["data"], "v": round(float(q["cena"]), 2)} for q in nbp if 50 < float(q["cena"]) < 5000]
          except Exception as e:
              print("Aviso: historico NBP falhou:", e)

          usd_pln = None
          try:
              usd_pln = float(get("https://api.nbp.pl/api/exchangerates/rates/a/usd/?format=json")["rates"][0]["mid"])
              assert 1 < usd_pln < 10
          except Exception as e:
              usd_pln = None
              print("Aviso: cambio NBP falhou:", e)

          xau = None
          try:
              xau = float(get("https://api.gold-api.com/price/XAU")["price"])
              assert 500 < xau < 50000
          except Exception as e:
              xau = None
              print("Aviso: spot falhou:", e)

          agora = datetime.datetime.now(datetime.timezone.utc)
          if xau and usd_pln:
              pln_g = round(xau * usd_pln / 31.1034768, 2)
              data = agora.strftime("%Y-%m-%d")
              fonte = "api.gold-api.com (XAU/USD) x kurs średni USD NBP"
          elif serie:
              pln_g = serie[-1]["v"]
              data = serie[-1]["d"]
              fonte = "Cena złota NBP"
          else:
              print("Erro: nenhuma fonte respondeu, o ficheiro fica como estava")
              sys.exit(1)

          dados = {
              "plnG": pln_g,
              "xauUsd": round(xau, 2) if xau else None,
              "usdPln": round(usd_pln, 4) if usd_pln else None,
              "data": data,
              "atualizadoEm": agora.strftime("%Y-%m-%dT%H:%M:%SZ"),
              "fonte": fonte,
              "nbp": serie
          }
          with open("pl-zloto/zloto-dane.json", "w") as f:
              f.write(json.dumps(dados, ensure_ascii=False, indent=1) + "\n")
          print(f"plnG={pln_g} data={data} nbp={len(serie)}")

      - name: Commit e push se houver alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pl-zloto/zloto-dane.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
          else
            git commit -m "Atualizar preco do ouro em PLN ($(date -u +%F))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
